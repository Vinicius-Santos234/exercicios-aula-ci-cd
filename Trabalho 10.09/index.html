<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cronos | Tempo de Vida & Biométrica</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-deep: #07090e;
            --bg-card: rgba(15, 23, 42, 0.75);
            --border-glow: rgba(56, 189, 248, 0.2);
            --border-subtle: rgba(255, 255, 255, 0.08);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --cyan-accent: #06b6d4;
            --blue-accent: #3b82f6;
            --purple-accent: #8b5cf6;
            --emerald-accent: #10b981;
            --rose-accent: #f43f5e;
        }

        body {
            background-color: var(--bg-deep);
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            color: var(--text-primary);
            position: relative;
            overflow-x: hidden;
        }

        /* Efeitos luminosos de fundo cósmico/temporal */
        .ambient-glow {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            pointer-events: none;
            z-index: 0;
            opacity: 0.45;
        }

        .glow-1 {
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, #3b82f6 0%, #1d4ed8 70%);
            top: -100px;
            left: -100px;
            animation: pulseGlow 12s ease-in-out infinite alternate;
        }

        .glow-2 {
            width: 480px;
            height: 480px;
            background: radial-gradient(circle, #8b5cf6 0%, #6d28d9 70%);
            bottom: -120px;
            right: -100px;
            animation: pulseGlow 14s ease-in-out infinite alternate-reverse;
        }

        .glow-3 {
            width: 320px;
            height: 320px;
            background: radial-gradient(circle, #06b6d4 0%, #0e7490 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            opacity: 0.2;
        }

        @keyframes pulseGlow {
            0% { transform: scale(1) translate(0, 0); opacity: 0.35; }
            100% { transform: scale(1.15) translate(30px, 30px); opacity: 0.55; }
        }

        /* Container principal */
        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 460px;
        }

        /* Cartão Glassmorphism futurista */
        .card {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 1px solid var(--border-subtle);
            box-shadow: 
                0 25px 50px -12px rgba(0, 0, 0, 0.7),
                0 0 0 1px rgba(255, 255, 255, 0.05),
                inset 0 1px 0 0 rgba(255, 255, 255, 0.12);
            padding: 2.25rem 2rem;
            position: relative;
            overflow: hidden;
        }

        /* Faixa de reflexo no topo do card */
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 10%;
            right: 10%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(56, 189, 248, 0.6), transparent);
        }

        /* Topo: Ícone e Título */
        .header-section {
            text-align: center;
            margin-bottom: 2rem;
        }

        .icon-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 68px;
            height: 68px;
            border-radius: 20px;
            background: linear-gradient(135deg, rgba(6, 182, 212, 0.15) 0%, rgba(139, 92, 246, 0.2) 100%);
            border: 1px solid rgba(56, 189, 248, 0.3);
            box-shadow: 0 0 25px rgba(6, 182, 212, 0.25);
            margin-bottom: 1.25rem;
            position: relative;
        }

        .icon-badge svg {
            width: 34px;
            height: 34px;
            color: #38bdf8;
            filter: drop-shadow(0 2px 8px rgba(56, 189, 248, 0.5));
            animation: rotateIcon 20s linear infinite;
        }

        @keyframes rotateIcon {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .category-tag {
            display: inline-block;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: #38bdf8;
            background: rgba(6, 182, 212, 0.1);
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            border: 1px solid rgba(56, 189, 248, 0.25);
            margin-bottom: 0.65rem;
        }

        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.85rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #ffffff 30%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.4rem;
        }

        .subtitle {
            font-size: 0.88rem;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        /* Formulário */
        .form-group {
            margin-bottom: 1.35rem;
        }

        label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.82rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #cbd5e1;
            margin-bottom: 0.5rem;
        }

        label svg {
            width: 15px;
            height: 15px;
            color: #38bdf8;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 1rem;
            width: 20px;
            height: 20px;
            color: var(--text-muted);
            transition: color 0.2s;
            pointer-events: none;
        }

        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 0.85rem 1rem 0.85rem 2.85rem;
            font-size: 0.95rem;
            font-family: inherit;
            color: #ffffff;
            background-color: rgba(15, 23, 42, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            outline: none;
            transition: all 0.25s ease;
        }

        input[type="text"]::placeholder,
        input[type="number"]::placeholder {
            color: #475569;
        }

        input[type="text"]:focus,
        input[type="number"]:focus {
            border-color: #38bdf8;
            background-color: rgba(15, 23, 42, 0.95);
            box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.15), 0 0 15px rgba(56, 189, 248, 0.2);
        }

        .input-wrapper:focus-within .input-icon {
            color: #38bdf8;
        }

        /* Tags de prévia das métricas */
        .features-pill-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.5rem;
            margin: 1.5rem 0;
            padding: 0.75rem;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .pill-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 0.25rem;
            font-size: 0.72rem;
            color: var(--text-secondary);
        }

        .pill-item svg {
            width: 18px;
            height: 18px;
        }

        .pill-heart svg { color: var(--rose-accent); }
        .pill-breath svg { color: var(--emerald-accent); }
        .pill-time svg { color: var(--cyan-accent); }

        /* Ações e Botões */
        .actions {
            display: flex;
            gap: 0.85rem;
            margin-top: 1.5rem;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.85rem 1.25rem;
            font-size: 0.92rem;
            font-weight: 600;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            font-family: inherit;
        }

        .btn-primary {
            flex: 2;
            background: linear-gradient(135deg, #0284c7 0%, #2563eb 50%, #7c3aed 100%);
            color: #ffffff;
            border: none;
            box-shadow: 0 4px 20px rgba(37, 99, 235, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.2);
            position: relative;
            overflow: hidden;
        }

        .btn-primary::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.6s ease;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(37, 99, 235, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }

        .btn-primary:hover::after {
            left: 100%;
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        .btn-secondary {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            color: #94a3b8;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.09);
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.2);
        }

        .btn-secondary:active {
            transform: scale(0.98);
        }

        .btn svg {
            width: 18px;
            height: 18px;
        }

        .footer-note {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.75rem;
            color: #475569;
        }

        @media (max-width: 480px) {
            .card {
                padding: 1.75rem 1.25rem;
                border-radius: 20px;
            }
            .features-pill-grid {
                grid-template-columns: 1fr;
                gap: 0.75rem;
            }
            .pill-item {
                flex-direction: row;
                justify-content: center;
                gap: 0.5rem;
            }
        }
    </style>
</head>
<body>
    <!-- Fundo com luzes ambientais holográficas -->
    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>
    <div class="ambient-glow glow-3"></div>

    <div class="container">
        <main class="card">
            <header class="header-section">
                <div class="icon-badge">
                    <!-- Símbolo Temporal Cósmico / Astrolábio -->
                    <svg fill="none" stroke="currentColor" stroke-width="1.75" viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="9"></circle>
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v3m0 12v3M3 12h3m12 0h3"></path>
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 7v5l3 3"></path>
                    </svg>
                </div>
                <br>
                <span class="category-tag">Bio-Métricas &amp; Tempo</span>
                <h1>Tempo de Vida</h1>
                <p class="subtitle">Descubra sua jornada em dias, batimentos cardíacos e ciclos respiratórios percorridos.</p>
            </header>

            <form action="calcular.php" method="post">
                <div class="form-group">
                    <label for="nome">
                        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                        </svg>
                        Nome Completo
                    </label>
                    <div class="input-wrapper">
                        <svg class="input-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M5.121 17.804A13.937 13.937 0 0112 16c2.5 0 4.847.655 6.879 1.804M15 10a3 3 0 11-6 0 3 3 0 016 0zm6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        </svg>
                        <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required autocomplete="name">
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="ano">
                        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                        </svg>
                        Ano de Nascimento
                    </label>
                    <div class="input-wrapper">
                        <svg class="input-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        </svg>
                        <input type="number" id="ano" name="ano" placeholder="Ex: 2004" required min="1900" max="2026">
                    </div>
                </div>

                <!-- Pílulas de indicadores que serão calculados -->
                <div class="features-pill-grid">
                    <div class="pill-item pill-heart">
                        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path>
                        </svg>
                        <span>Batimentos (~75 bpm)</span>
                    </div>
                    <div class="pill-item pill-breath">
                        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M14 10l-2 1m0 0l-2-1m2 1v2.5M20 7l-2 1m2-1l-2-1m2 1v2.5M14 4l-2-1-2 1M4 7l2-1M4 7l2 1M4 7v2.5M12 21l-2-1m2 1l2-1m-2 1v-2.5M6 18l-2-1v-2.5M18 18l2-1v-2.5"></path>
                        </svg>
                        <span>Respirações (~20 rpm)</span>
                    </div>
                    <div class="pill-item pill-time">
                        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                        </svg>
                        <span>Meta 90 anos</span>
                    </div>
                </div>

                <div class="actions">
                    <button type="submit" class="btn btn-primary">
                        <span>Calcular Tempo</span>
                        <svg fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
                        </svg>
                    </button>
                    <button type="reset" class="btn btn-secondary">
                        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                        </svg>
                        <span>Limpar</span>
                    </button>
                </div>
            </form>

            <p class="footer-note">Cálculos baseados em médias vitais humanas universais</p>
        </main>
    </div>
</body>
</html>
