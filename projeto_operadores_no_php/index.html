<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora em PHP | Operadores</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>

    <main class="container">
        <div class="card">
            <header class="card-header">
                <span class="badge-tag">PHP Básico & Operadores</span>
                <h1 class="card-title">Calculadora de Operações</h1>
                <p class="card-subtitle">Informe dois números para processar todos os operadores matemáticos e lógicos em PHP.</p>
            </header>

            <form action="operacoes.php" method="post">
                <div class="form-group">
                    <label for="numero1">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="4" y1="9" x2="20" y2="9"></line>
                            <line x1="4" y1="15" x2="20" y2="15"></line>
                            <line x1="10" y1="3" x2="8" y2="21"></line>
                            <line x1="16" y1="3" x2="14" y2="21"></line>
                        </svg>
                        Primeiro Número:
                    </label>
                    <div class="input-container">
                        <input type="number" name="numero1" id="numero1" placeholder="Ex: 10" required autofocus>
                    </div>
                </div>

                <div class="form-group">
                    <label for="numero2">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="4" y1="9" x2="20" y2="9"></line>
                            <line x1="4" y1="15" x2="20" y2="15"></line>
                            <line x1="10" y1="3" x2="8" y2="21"></line>
                            <line x1="16" y1="3" x2="14" y2="21"></line>
                        </svg>
                        Segundo Número:
                    </label>
                    <div class="input-container">
                        <input type="number" name="numero2" id="numero2" placeholder="Ex: 2" required>
                    </div>
                </div>

                <input type="submit" value="Calcular Operações">
            </form>
        </div>
    </main>
</body>
</html>
